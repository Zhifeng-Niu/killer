# Odysseus Agent Framework - Docker Compose
#
# 一键启动:
#   DEEPSEEK_API_KEY=your-key docker compose up -d
#
# 或用 .env 文件:
#   cp .env.example .env  →  编辑填入 API key  →  docker compose up -d

services:
  odysseus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odysseus-agent
    restart: unless-stopped
    ports:
      - "${ODYSSEUS_PORT:-3000}:3000"
    environment:
      # Provider 自动检测 — 只需设一个 API key
      - ODYSSEUS_LLM_PROVIDER=${ODYSSEUS_LLM_PROVIDER:-}
      - ODYSSEUS_API_KEY=${ODYSSEUS_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - VOLCENGINE_API_KEY=${VOLCENGINE_API_KEY:-}
      - BAICHUAN_API_KEY=${BAICHUAN_API_KEY:-}
      - YI_API_KEY=${YI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # 可选配置
      - ODYSSEUS_MODEL=${ODYSSEUS_MODEL:-}
      - ODYSSEUS_API_TOKEN=${ODYSSEUS_API_TOKEN:-}
      - ODYSSEUS_LOG_LEVEL=${ODYSSEUS_LOG_LEVEL:-info}
      - ODYSSEUS_DEBUG=${ODYSSEUS_DEBUG:-false}
      # Session store type (memory | file)
      - ODYSSEUS_SESSION_STORE=${ODYSSEUS_SESSION_STORE:-file}
    volumes:
      - odysseus-data:/app/.odysseus
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # K8s-friendly resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  odysseus-data:
    driver: local
